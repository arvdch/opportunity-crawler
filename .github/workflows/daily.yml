name: Daily Opportunity Crawler

on:
  # Run every day at 8:00 AM IST (2:30 AM UTC)
  schedule:
    - cron: "30 2 * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug output"
        required: false
        default: "false"

jobs:
  crawl:
    name: Crawl & Notify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout your repo ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Restore seen_urls.json from cache ───────────────
      #
      # This is the key trick: we cache seen_urls.json between runs
      # so deduplication persists even though Actions has no disk.
      # The cache key includes the date so it refreshes daily
      # but the restore-keys fallback grabs the previous day's cache.
      #
      - name: Restore dedup cache
        uses: actions/cache@v4
        with:
          path: seen_urls.json
          key: seen-urls-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            seen-urls-${{ runner.os }}-

      # ── 5. Run the crawler ─────────────────────────────────
      - name: Run crawler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}               # Recommended — free at console.groq.com/keys
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # Fallback if no Groq key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}           # Fallback — free at aistudio.google.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}     # Optional, paid fallback
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      # ── 6. Save seen_urls.json back to cache ───────────────
      - name: Save dedup cache
        uses: actions/cache@v4
        if: always()  # Save even if the crawler had errors
        with:
          path: seen_urls.json
          key: seen-urls-${{ runner.os }}-${{ github.run_id }}

      # ── 7. Upload seen_urls.json as artifact for debugging ──
      - name: Upload dedup state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seen-urls-${{ github.run_number }}
          path: seen_urls.json
          retention-days: 7
